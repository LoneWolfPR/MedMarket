openapi: 3.0.3
info:
  title: MedMarket API
  version: 0.1.0
  description: Prescription price comparison platform API.

servers:
  - url: /

paths:
  /api/auth/register:
    post:
      operationId: registerUser
      summary: Register a new user account
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      operationId: loginUser
      summary: Exchange credentials for a bearer token
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/profile:
    get:
      operationId: getProfile
      summary: Get the authenticated user's profile
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/prescriptions/upload:
    post:
      operationId: uploadPrescription
      summary: Upload a prescription document and its metadata
      tags: [prescriptions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document, physicianName, medName, strengthValue, strengthUnit, quantity]
              properties:
                document:
                  type: string
                  format: binary
                  description: The prescription document (image or PDF)
                physicianName:
                  type: string
                medName:
                  type: string
                strengthValue:
                  type: string
                strengthUnit:
                  type: string
                quantity:
                  type: integer
      responses:
        '201':
          description: Prescription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/prescriptions:
    get:
      operationId: listPrescriptions
      summary: List the authenticated user's prescriptions
      tags: [prescriptions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user's prescriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/prescriptions/{id}/search:
    post:
      operationId: searchPrescriptionPrices
      summary: Search pharmacies for prices on a prescription's medication
      tags: [prescriptions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The prescription to price
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Quotes from the pharmacies that stock the medication, cheapest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders:
    get:
      operationId: listOrders
      summary: List the authenticated user's orders, newest first
      tags: [orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user's orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createOrder
      summary: Place an order for a persisted offer
      tags: [orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'

  /api/orders/{id}/status:
    get:
      operationId: getOrderStatus
      summary: Get an order's lifecycle status and live shipping detail
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The order to look up
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The order's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/shipping/{orderID}:
    post:
      operationId: shippingWebhook
      summary: Receive a shipping status update from the shipping provider
      description: >-
        Called by the shipping provider (not the SPA) to report a shipment status
        change; signals the order's running workflow. Unauthenticated in local dev —
        a real provider would authenticate with a signed token.
      tags: [webhooks]
      parameters:
        - name: orderID
          in: path
          required: true
          description: The order whose workflow should receive the update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingWebhookRequest'
      responses:
        '202':
          description: Update accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: The requested resource is no longer available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Address:
      type: object
      required: [street1, city, state, zip]
      properties:
        street1:
          type: string
        street2:
          type: string
        city:
          type: string
        state:
          type: string
          description: Two-letter state abbreviation
          minLength: 2
          maxLength: 2
        zip:
          type: string

    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        phone:
          type: string
        address:
          $ref: '#/components/schemas/Address'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    UserResponse:
      type: object
      required: [id, email, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        address:
          $ref: '#/components/schemas/Address'

    PrescriptionResponse:
      type: object
      required: [id, physicianName, medName, strengthValue, strengthUnit, quantity, documentUrl]
      properties:
        id:
          type: string
          format: uuid
        physicianName:
          type: string
        medName:
          type: string
        strengthValue:
          type: string
        strengthUnit:
          type: string
        quantity:
          type: integer
        documentUrl:
          type: string
          description: Short-lived presigned URL to the uploaded document

    # Collection responses are wrapped in an object rather than returned as a
    # top-level array. An array has nowhere to grow: adding a count, a page
    # token, or a partial-results warning later would break every client,
    # whereas new fields on an object are additive.
    PrescriptionListResponse:
      type: object
      required: [prescriptions]
      properties:
        prescriptions:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionResponse'

    QuoteResponse:
      type: object
      required: [offerId, pharmacyId, pharmacyName, pharmacyItemId, unitPriceCents, totalCents]
      properties:
        offerId:
          type: string
          format: uuid
          description: >-
            The offer this quote was persisted as. Orders reference it by id so the
            customer is charged the price that was quoted here, rather than whatever
            the pharmacy re-quotes at order time. Valid until the offer expires.
        pharmacyId:
          type: string
          format: uuid
        pharmacyName:
          type: string
        pharmacyItemId:
          type: string
          description: The pharmacy's own identifier for the item (SKU, code, ...)
        unitPriceCents:
          type: integer
          format: int64
          description: Price per unit, in cents
        totalCents:
          type: integer
          format: int64
          description: Unit price multiplied by the prescription quantity, in cents

    QuoteListResponse:
      type: object
      required: [quotes]
      properties:
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/QuoteResponse'

    OrderRequest:
      type: object
      required: [offerId, paymentMethod]
      properties:
        offerId:
          type: string
          format: uuid
          description: The offer to order, from a prior price search
        paymentMethod:
          type: string
          description: A payment method token (e.g. a Stripe pm_... token)

    OrderResponse:
      type: object
      required: [orderId, itemName, quantity, status]
      properties:
        orderId:
          type: string
          format: uuid
        itemName:
          type: string
        quantity:
          type: integer
        status:
          type: string
          description: The order's current lifecycle status

    OrderSummaryResponse:
      type: object
      required: [orderId, itemName, quantity, status, placedAt]
      properties:
        orderId:
          type: string
          format: uuid
        itemName:
          type: string
          description: The medication name, copied from the prescription this order was placed against
        quantity:
          type: integer
        status:
          type: string
          description: The order's current lifecycle status
        placedAt:
          type: string
          format: date-time
        pricePaidCents:
          type: integer
          format: int64
          description: >-
            What the payment processor actually captured, in cents. Absent until
            capture succeeds — note that zero is a legitimate captured amount
            (full insurance coverage), so it must not be read as unpaid.

    OrderListResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummaryResponse'

    OrderStatusResponse:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          format: uuid
        status:
          type: string
          description: >-
            The coarse order lifecycle status (placed, confirmed, shipped, delivered, canceled, failed)
        shippingStatus:
          type: string
          description: >-
            The live fine-grained shipping status from the order's workflow (picked_up,
            in_transit, out_for_delivery, delivered). Absent once the workflow has
            completed or aged out — the order status carries the state then.

    ShippingWebhookRequest:
      type: object
      required: [trackingId, status, occurredAt]
      properties:
        trackingId:
          type: string
        status:
          type: string
          description: >-
            The provider's status (e.g. picked_up, in_transit, out_for_delivery, delivered)
        occurredAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
