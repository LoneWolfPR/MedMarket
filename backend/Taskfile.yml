# Backend (Go) tasks. Included by the root Taskfile under the `backend:`
# namespace with dir set to ./backend, so these run from the module root.
version: '3'

tasks:
  build:
    desc: Compile all backend packages
    cmds:
      - go build ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (uses the repo-root .golangci.yml)
    # --build-tags=integration so build-tagged integration test files are linted
    # too (static analysis only — no Docker needed).
    cmds:
      - golangci-lint run --build-tags=integration ./...

  test:
    desc: Run backend unit tests
    cmds:
      - go test ./...

  test-integration:
    desc: Run integration tests (needs Docker; uses testcontainers). Excluded from `check`.
    cmds:
      - go test -tags=integration ./...

  tidy:
    desc: Tidy and verify go.mod / go.sum
    cmds:
      - go mod tidy

  generate:
    desc: Regenerate the Ent client from schema definitions
    cmds:
      - go generate ./ent

  generate-api:
    desc: Regenerate HTTP models + strict server from the OpenAPI spec (api/api.yaml)
    cmds:
      - go generate ./api/...

  migrate-diff:
    desc: 'Generate a migration from the Ent schema diff. Usage: task backend:migrate-diff -- <name>'
    # GOWORK=off for the same reason as generate — Atlas's ent:// loader.
    env:
      GOWORK: 'off'
    cmds:
      - atlas migrate diff {{.CLI_ARGS}} --env local

  migrate-apply:
    desc: Apply pending migrations to the local Postgres (localhost:5433)
    cmds:
      - atlas migrate apply --env local

  check:
    desc: Build, vet, test, and lint in one shot
    cmds:
      - task: build
      - task: vet
      - task: test
      - task: lint
