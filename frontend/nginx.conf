server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # forever — a new build produces new names rather than mutating these.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unmatched paths serve index.html so client-side routing
    # survives deep links and refreshes. index.html itself is left uncached
    # (nginx default) so a new deploy is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
