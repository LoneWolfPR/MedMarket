# Root task runner (https://taskfile.dev). Run `task` (or `task --list`) to see
# everything available. Per-module tasks live in their own Taskfiles and are
# pulled in under a namespace via `includes` below (e.g. `task backend:lint`).
version: '3'

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  up:
    desc: Start the full local stack (builds images)
    cmds:
      - docker compose up --build

  down:
    desc: Stop the local stack
    cmds:
      - docker compose down

  logs:
    desc: Tail logs from the running stack
    cmds:
      - docker compose logs -f

  # The node pool autoscales 0–2, so parking is done by removing/adding pod
  # demand — NOT by resizing nodes (the autoscaler would just counteract it).
  cluster-up:
    desc: bring staging back up (autoscaler wakes nodes from 0; pulls :latest images)
    cmds:
      - kubectl apply -k k8s/overlays/staging

  cluster-down:
    desc: park — scale workloads to 0 and drop the LB; namespace + PVC data persist
    cmds:
      - kubectl scale statefulset,deployment --all --replicas=0 -n staging
      - kubectl delete ingress medmarket -n staging --ignore-not-found