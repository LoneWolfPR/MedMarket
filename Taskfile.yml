# Root task runner (https://taskfile.dev). Run `task` (or `task --list`) to see
# everything available. Per-module tasks live in their own Taskfiles and are
# pulled in under a namespace via `includes` below (e.g. `task backend:lint`).
version: '3'

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  up:
    desc: Start the full local stack (builds images)
    cmds:
      - docker compose up --build

  down:
    desc: Stop the local stack
    cmds:
      - docker compose down

  logs:
    desc: Tail logs from the running stack
    cmds:
      - docker compose logs -f

  cluster-up:
    desc: scale the pool back to working capacity
    cmds:
      - gcloud container clusters resize medmarket --node-pool medmarket-pool --num-nodes 2 --zone us-central1-a --quiet

  cluster-down:
    desc: park it at $0 (the end-of-day command)
    cmds:
      - gcloud container clusters resize medmarket --node-pool medmarket-pool --num-nodes 0 --zone us-central1-a --quiet