# Root task runner (https://taskfile.dev). Run `task` (or `task --list`) to see
# everything available. Per-module tasks live in their own Taskfiles and are
# pulled in under a namespace via `includes` below (e.g. `task backend:lint`).
version: '3'

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  up:
    desc: Start the full local stack (builds images)
    cmds:
      - docker compose up --build

  down:
    desc: Stop the local stack
    cmds:
      - docker compose down

  logs:
    desc: Tail logs from the running stack
    cmds:
      - docker compose logs -f

  # Parking to $0 requires disabling autoscaling: with it on, the autoscaler
  # re-adds nodes to run kube-system pods (kube-dns needs 2), so a plain
  # resize-to-0 bounces back. So: disable autoscaling → resize 0 (holds).
  # cluster-up re-enables it and lets the autoscaler wake nodes for the workloads.
  cluster-up:
    desc: bring staging back up — re-enable autoscaling, then apply (autoscaler scales from 0)
    cmds:
      - gcloud container clusters update medmarket --enable-autoscaling --min-nodes 0 --max-nodes 2 --node-pool medmarket-pool --zone us-central1-a
      - kubectl apply -k k8s/overlays/staging

  cluster-down:
    desc: park at $0 — drop the LB, disable autoscaling, resize nodes to 0 (PVC data persists)
    cmds:
      - kubectl delete ingress medmarket -n staging --ignore-not-found
      - gcloud container clusters update medmarket --no-enable-autoscaling --node-pool medmarket-pool --zone us-central1-a
      - gcloud container clusters resize medmarket --node-pool medmarket-pool --num-nodes 0 --zone us-central1-a --quiet