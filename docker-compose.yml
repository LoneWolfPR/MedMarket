name: medmarket

services:
  traefik:
    image: traefik:v3.6
    command:
      # Dashboard on :8080 (insecure mode is fine for local dev only).
      - "--api.insecure=true"
      # Auto-discover services from Docker labels; require explicit opt-in.
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard — http://localhost:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - medmarket

  backend:
    build:
      context: ./backend
      args:
        CMD: server
    environment:
      - PORT=8080
      # In-container DB host is the compose service name on 5432 — NOT host 5433.
      - DATABASE_URL=postgres://medmarket:medmarket@postgres:5432/medmarket?sslmode=disable
      # Local-dev only. Real secrets come from the platform on GKE.
      - JWT_SECRET=local-dev-insecure-secret-change-me
      - JWT_TTL=24h
      # Mock PHarmacy service config variables
      - PHARMACY_A_BASE_URL=http://mock-pharmacy-a:8080
      - PHARMACY_A_SECRET=pharmacy-a-dev-key
      - PHARMACY_B_BASE_URL=http://mock-pharmacy-b:8080
      - PHARMACY_B_SECRET=pharmacy-b-dev-token
      # MinIO (S3-compatible) — in-container endpoint is the service name on the
      # API port 9000; console (9001) is host-inspection only.
      - MINIO_ENDPOINT=minio:9000
      # Host-reachable S3-API host (Traefik-routed) used ONLY to sign presigned
      # URLs so the browser can resolve them; the backend still Puts via
      # MINIO_ENDPOINT over the compose network.
      - MINIO_PUBLIC_ENDPOINT=s3.localhost
      - MINIO_REGION=us-east-1
      - MINIO_ACCESS_KEY=medmarket
      - MINIO_SECRET_KEY=medmarket-dev-secret
      - MINIO_BUCKET=prescriptions
      - MINIO_USE_SSL=false
      # Mailpit SMTP — the SMTP adapter dials this; the web UI (8025) is
      # host-inspection only.
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=no-reply@medmarket.local
    labels:
      - "traefik.enable=true"
      # PathPrefix(/api) is longer than the frontend's PathPrefix(/), so Traefik
      # gives it higher priority automatically — /api/* routes here.
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    depends_on:
      # Wait until Postgres is actually accepting connections, not just started —
      # main.go pings with a fail-fast 5s timeout and exits on refusal.
      postgres:
        condition: service_healthy
      # Wait until the prescriptions bucket exists so the MinIO adapter's
      # startup bucket check can't race the one-shot creator.
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks:
      - medmarket

  # Temporal worker — a second binary from the same backend image (CMD=worker).
  # Polls Temporal for price-search workflow/activity tasks; reaches Postgres, the
  # mock pharmacies, and Temporal over the network. No inbound ports of its own.
  worker:
    build:
      context: ./backend
      args:
        CMD: worker
    environment:
      # In-container DB host is the compose service name on 5432 — NOT host 5433.
      - DATABASE_URL=postgres://medmarket:medmarket@postgres:5432/medmarket?sslmode=disable
      - PHARMACY_A_BASE_URL=http://mock-pharmacy-a:8080
      - PHARMACY_A_SECRET=pharmacy-a-dev-key
      - PHARMACY_B_BASE_URL=http://mock-pharmacy-b:8080
      - PHARMACY_B_SECRET=pharmacy-b-dev-token
      - TEMPORAL_HOSTPORT=temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    networks:
      - medmarket

  frontend:
    build:
      context: ./frontend
    volumes:
      # Bind-mount source for HMR; keep node_modules in a container-owned volume.
      - ./frontend:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    networks:
      - medmarket

  # Mock pharmacy A — REST/JSON API. The backend reaches it directly over the
  # network as http://mock-pharmacy-a:8080; the Traefik Host rule is only so you
  # can inspect it from the host (a Host rule avoids colliding with the
  # backend's PathPrefix(/api)). Curl it via: -H "Host: pharmacy-a.localhost".
  mock-pharmacy-a:
    build:
      context: ./services/mock-pharmacy-a
    environment:
      - PORT=8080
      - API_KEY=pharmacy-a-dev-key
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pharmacy-a.rule=Host(`pharmacy-a.localhost`)"
      - "traefik.http.routers.pharmacy-a.entrypoints=web"
      - "traefik.http.services.pharmacy-a.loadbalancer.server.port=8080"
    networks:
      - medmarket

  # Mock pharmacy B — GraphQL API with a deliberately different shape/auth.
  # Reached as http://mock-pharmacy-b:8080. Curl via: -H "Host: pharmacy-b.localhost".
  mock-pharmacy-b:
    build:
      context: ./services/mock-pharmacy-b
    environment:
      - PORT=8080
      - API_TOKEN=pharmacy-b-dev-token
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pharmacy-b.rule=Host(`pharmacy-b.localhost`)"
      - "traefik.http.routers.pharmacy-b.entrypoints=web"
      - "traefik.http.services.pharmacy-b.loadbalancer.server.port=8080"
    networks:
      - medmarket

  # Mock shipping — webhook-driven status progression. Reached as
  # http://mock-shipping:8080. Curl via: -H "Host: shipping.localhost".
  mock-shipping:
    build:
      context: ./services/mock-shipping
    environment:
      - PORT=8080
      # Seconds-per-stage in the ~60s delivered timeline; lower for tests.
      - SHIPPING_INTERVAL_MS=15000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shipping.rule=Host(`shipping.localhost`)"
      - "traefik.http.routers.shipping.entrypoints=web"
      - "traefik.http.services.shipping.loadbalancer.server.port=8080"
    networks:
      - medmarket

  # MinIO — S3-compatible object storage for prescription documents. The backend
  # talks to the S3 API over the network at http://minio:9000; the console (9001)
  # is routed through Traefik for host inspection (Host rule, like the mocks) at
  # http://minio.localhost. Curl the console via: -H "Host: minio.localhost".
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=medmarket
      - MINIO_ROOT_PASSWORD=medmarket-dev-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - minio-data:/data
    labels:
      - "traefik.enable=true"
      # Console UI (9001) at http://minio.localhost — host inspection only.
      - "traefik.http.routers.minio-console.rule=Host(`minio.localhost`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      # S3 API (9000) at http://s3.localhost — a host-reachable path to the S3
      # API so presigned URLs (signed against this host) resolve from the
      # browser. Two services on one container ⇒ each router names its service.
      - "traefik.http.routers.minio-s3.rule=Host(`s3.localhost`)"
      - "traefik.http.routers.minio-s3.entrypoints=web"
      - "traefik.http.routers.minio-s3.service=minio-s3"
      - "traefik.http.services.minio-s3.loadbalancer.server.port=9000"
    networks:
      - medmarket

  # One-shot: create the prescriptions bucket once MinIO is healthy, then exit.
  # The official minio image doesn't auto-create buckets, so we use the mc client.
  # --ignore-existing keeps it idempotent across restarts.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 medmarket medmarket-dev-secret &&
      mc mb --ignore-existing local/prescriptions
      "
    networks:
      - medmarket

  # Mailpit — captures all outbound SMTP locally. The SMTP adapter dials
  # mailpit:1025; the web UI (8025) is routed through Traefik for inspection at
  # http://mail.localhost. Curl via: -H "Host: mail.localhost".
  mailpit:
    image: axllent/mailpit:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    networks:
      - medmarket

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=medmarket
      - POSTGRES_PASSWORD=medmarket
      - POSTGRES_DB=medmarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medmarket -d medmarket"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      # Host 5433 → container 5432 to avoid clashing with a local Postgres on
      # 5432. Point local tooling (e.g. Atlas on Day 2) at localhost:5433.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - medmarket

  # --- Temporal ---------------------------------------------------------------
  # Durable workflow engine. Runs as its own cluster (temporal) backed by a
  # dedicated Postgres (temporal-db) — Temporal must NOT share the app database.
  # The worker (backend/cmd/worker, Day 5) and the API connect to temporal:7233
  # over the network; 7233 is also published so the host `temporal` CLI can reach it.

  # Temporal's own Postgres, separate from the app's `postgres`. The auto-setup
  # image creates the `temporal` and `temporal_visibility` databases inside it on
  # first boot, so no POSTGRES_DB is set here.
  temporal-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    networks:
      - medmarket

  # Temporal server (auto-setup image): runs schema setup and creates the default
  # namespace on first boot, then starts the server. DB=postgres12 is the driver
  # name (compatible with Postgres 17); POSTGRES_SEEDS is the temporal-db host.
  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    ports:
      - "7233:7233" # gRPC frontend — host access for the `temporal` CLI/tooling
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      temporal-db:
        condition: service_healthy
    networks:
      - medmarket

  # Temporal Web UI, routed through Traefik at http://temporal.localhost (a Host
  # rule like the other dashboards — avoids the SPA base-path config the plan's
  # /temporal/ subpath would need, and never collides with the backend's /api).
  temporal-ui:
    image: temporalio/ui:2.52.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://temporal.localhost
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.temporal-ui.rule=Host(`temporal.localhost`)"
      - "traefik.http.routers.temporal-ui.entrypoints=web"
      - "traefik.http.services.temporal-ui.loadbalancer.server.port=8080"
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - medmarket

volumes:
  postgres-data:
  minio-data:
  temporal-db-data:

networks:
  medmarket:
    driver: bridge
