name: medmarket

services:
  traefik:
    image: traefik:v3.6
    command:
      # Dashboard on :8080 (insecure mode is fine for local dev only).
      - "--api.insecure=true"
      # Auto-discover services from Docker labels; require explicit opt-in.
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard — http://localhost:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - medmarket

  backend:
    build:
      context: ./backend
    environment:
      - PORT=8080
      # In-container DB host is the compose service name on 5432 — NOT host 5433.
      - DATABASE_URL=postgres://medmarket:medmarket@postgres:5432/medmarket?sslmode=disable
      # Local-dev only. Real secrets come from the platform on GKE.
      - JWT_SECRET=local-dev-insecure-secret-change-me
      - JWT_TTL=24h
      # Mock PHarmacy service config variables
      - PHARMACY_A_BASE_URL=http://mock-pharmacy-a:8080
      - PHARMACY_A_SECRET=pharmacy-a-dev-key
      - PHARMACY_B_BASE_URL=http://mock-pharmacy-b:8080
      - PHARMACY_B_SECRET=pharmacy-b-dev-token
    labels:
      - "traefik.enable=true"
      # PathPrefix(/api) is longer than the frontend's PathPrefix(/), so Traefik
      # gives it higher priority automatically — /api/* routes here.
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    depends_on:
      # Wait until Postgres is actually accepting connections, not just started —
      # main.go pings with a fail-fast 5s timeout and exits on refusal.
      postgres:
        condition: service_healthy
    networks:
      - medmarket

  frontend:
    build:
      context: ./frontend
    volumes:
      # Bind-mount source for HMR; keep node_modules in a container-owned volume.
      - ./frontend:/app
      - /app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    networks:
      - medmarket

  # Mock pharmacy A — REST/JSON API. The backend reaches it directly over the
  # network as http://mock-pharmacy-a:8080; the Traefik Host rule is only so you
  # can inspect it from the host (a Host rule avoids colliding with the
  # backend's PathPrefix(/api)). Curl it via: -H "Host: pharmacy-a.localhost".
  mock-pharmacy-a:
    build:
      context: ./services/mock-pharmacy-a
    environment:
      - PORT=8080
      - API_KEY=pharmacy-a-dev-key
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pharmacy-a.rule=Host(`pharmacy-a.localhost`)"
      - "traefik.http.routers.pharmacy-a.entrypoints=web"
      - "traefik.http.services.pharmacy-a.loadbalancer.server.port=8080"
    networks:
      - medmarket

  # Mock pharmacy B — GraphQL API with a deliberately different shape/auth.
  # Reached as http://mock-pharmacy-b:8080. Curl via: -H "Host: pharmacy-b.localhost".
  mock-pharmacy-b:
    build:
      context: ./services/mock-pharmacy-b
    environment:
      - PORT=8080
      - API_TOKEN=pharmacy-b-dev-token
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pharmacy-b.rule=Host(`pharmacy-b.localhost`)"
      - "traefik.http.routers.pharmacy-b.entrypoints=web"
      - "traefik.http.services.pharmacy-b.loadbalancer.server.port=8080"
    networks:
      - medmarket

  # Mock shipping — webhook-driven status progression. Reached as
  # http://mock-shipping:8080. Curl via: -H "Host: shipping.localhost".
  mock-shipping:
    build:
      context: ./services/mock-shipping
    environment:
      - PORT=8080
      # Seconds-per-stage in the ~60s delivered timeline; lower for tests.
      - SHIPPING_INTERVAL_MS=15000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shipping.rule=Host(`shipping.localhost`)"
      - "traefik.http.routers.shipping.entrypoints=web"
      - "traefik.http.services.shipping.loadbalancer.server.port=8080"
    networks:
      - medmarket

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=medmarket
      - POSTGRES_PASSWORD=medmarket
      - POSTGRES_DB=medmarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medmarket -d medmarket"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      # Host 5433 → container 5432 to avoid clashing with a local Postgres on
      # 5432. Point local tooling (e.g. Atlas on Day 2) at localhost:5433.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - medmarket

volumes:
  postgres-data:

networks:
  medmarket:
    driver: bridge
