apiVersion: v1
kind: ServiceAccount
metadata:
  name: medmarket-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medmarket-backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: medmarket-backend
  template:
    metadata:
      labels:
        app: medmarket-backend
    spec:
      serviceAccountName: medmarket-backend
      # Apply Atlas migrations before the app starts. Idempotent + advisory-locked,
      # so it's safe even though the worker runs the same init concurrently. Retries
      # (pod restart) until Postgres is reachable.
      initContainers:
        - name: migrate
          image: medmarket-migrate
          command:
            ["atlas", "migrate", "apply", "--dir", "file:///migrations", "--url", "$(DATABASE_URL)"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: medmarket-secrets
                  key: DATABASE_URL
      containers:
        - name: backend
          image: medmarket-backend
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: medmarket-config
            - secretRef:
                name: medmarket-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: medmarket-backend
spec:
  selector:
    app: medmarket-backend
  ports:
  - port: 8080
    targetPort: 8080
