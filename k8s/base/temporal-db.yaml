# Temporal's OWN Postgres — deliberately separate from the app `postgres`.
# Temporal must never share the application database. The auto-setup server
# creates the `temporal` + `temporal_visibility` databases inside it on first
# boot, so no POSTGRES_DB is set here.
apiVersion: v1
kind: Service
metadata:
  name: temporal-db
spec:
  clusterIP: None
  selector:
    app: temporal-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-db
spec:
  serviceName: temporal-db
  replicas: 1
  selector:
    matchLabels:
      app: temporal-db
  template:
    metadata:
      labels:
        app: temporal-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            # Internal-only credentials guarding Temporal's own metadata DB; they
            # never leave the cluster, so they stay as plain literals rather than
            # going through the Secret (contrast the app DB password).
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              value: temporal
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
