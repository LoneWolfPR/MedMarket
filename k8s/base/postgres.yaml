# App database. StatefulSet (not Deployment) so the pod keeps a stable identity
# (postgres-0) and its own persistent disk across restarts/reschedules.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None            # headless: DNS resolves to the pod, no virtual IP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres      # must name the headless Service above
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: medmarket
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medmarket-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: medmarket
            # Point the data dir at a subdir of the mount: a fresh GKE disk has a
            # lost+found at its root and initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "medmarket", "-d", "medmarket"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:        # one PVC per pod (data-postgres-0), GKE PD-backed
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
