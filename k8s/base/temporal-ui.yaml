# Temporal Web UI. Internal-only (ClusterIP, no Ingress) — reach it via
# `kubectl port-forward svc/temporal-ui 8080:8080` for host inspection.
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
spec:
  selector:
    app: temporal-ui
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.52.1
          ports:
            - containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            # Set explicitly to override the Kubernetes-injected TEMPORAL_UI_PORT
            # (=tcp://<ip>:8080, from the Service of the same name), which the UI
            # otherwise reads as its listen port and fails to parse as an int.
            - name: TEMPORAL_UI_PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
